name: Security
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build production image
        run: |
          docker build \
            --target production \
            --tag docker-ci-demo:security \
            .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: docker-ci-demo:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
