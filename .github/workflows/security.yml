name: Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --target production \
            --tag docker-ci-demo:security \
            .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.73.0 \
            image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            docker-ci-demo:security
